name: Repository quality

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-quality:
    name: repository-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - name: Production build with synthetic public Firebase configuration
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: synthetic-build-only
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-fawcett-ledger.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-fawcett-ledger
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-fawcett-ledger.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '123456789'
          NEXT_PUBLIC_FIREBASE_APP_ID: synthetic-build-only
