name: Ledger emulator verification
on:
  pull_request:
    paths:
      - 'lib/ledger/**'
      - 'lib/financial-commands/**'
      - 'lib/agreements/**'
      - 'tests/ledger/**'
      - 'tests/ledger-firestore/**'
      - 'tests/legacy-import/**'
      - 'tests/agreements/**'
      - 'tests/financial-commands/**'
      - 'scripts/test-financial-commands-emulator.mjs'
      - 'firebase.commands-emulator.json'
      - 'scripts/reconcile-legacy-synthetic.mjs'
      - 'scripts/test-ledger-emulator.mjs'
      - 'firebase.ledger-emulator.json'
      - 'package*.json'
      - '.github/workflows/ledger-emulator.yml'
permissions:
  contents: read
jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run test:ledger
      - run: npm run test:contracts
      - run: npm run test:legacy-import
      - run: npm run test:ledger:emulator
      - run: npm run test:commands:emulator
